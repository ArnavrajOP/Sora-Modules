    <style>
        /* --- ESTILOS GENERALES --- */
        * { box-sizing: border-box; }
        
        body {
            margin: 0; padding: 0;
            width: 100%; height: 100vh;
            overflow: hidden; 
            background: url('fondo.webp') center center / cover no-repeat fixed;
            font-family: 'Play', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: -1;
            backdrop-filter: blur(3px);
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        #lista-server {
            width: 90%;
            max-width: 900px;
            max-height: 100vh;
            overflow-y: auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 10;
            scrollbar-width: thin; 
            scrollbar-color: #0084cc rgba(0,0,0,0.3);
        }

        h2 {
            text-align: center;
            color: mediumturquoise;
            font-size: 1.5rem;
            margin: 0 0 5px 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        h3 {
            text-align: center;
            color: #ffd700;
            font-size: 1rem;
            margin: 0 0 20px 0;
            font-weight: normal;
        }

        /* --- MENSAJE DE ERROR --- */
        .no-servers {
            color: #ff4c4c;
            background: rgba(255, 76, 76, 0.1);
            padding: 25px;
            border-radius: 12px;
            border: 1px dashed #ff4c4c;
            text-align: center;
            font-weight: bold;
            margin: 20px 0;
            width: 100%;
            max-width: 400px;
        }

        /* --- GRILLA DE SERVIDORES --- */
        #logo-list {
            list-style: none;
            padding: 0;
            margin: 0;
            width: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr); 
            gap: 15px;
        }

        #logo-list li {
            cursor: pointer;
            background-color: rgba(0, 0, 0, 0.6);
            border: 2px solid #0084cc;
            border-radius: 12px;
            padding: 15px 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            position: relative;
            min-height: 90px;
        }

        #logo-list li:hover {
            background-color: rgba(0, 132, 204, 0.2);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 132, 204, 0.3);
        }

        #logo-list img {
            width: 35px;
            height: 35px;
            object-fit: contain;
            margin-bottom: 8px;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
        }

        #logo-list span.nombre-server {
            color: white;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            text-align: center;
            word-break: break-word;
        }

        span.numero {
            position: absolute;
            top: 5px; left: 8px;
            font-size: 11px;
            color: #00a5ff;
            font-weight: bold;
        }

        .color-server-nyuu {
            border-color: #ffb743 !important;
            color: #ffb743 !important;
        }

        /* --- BOTÓN DESCARGA --- */
        #download-btn {
            margin-top: 30px;
            margin-bottom: 20px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.2s;
        }
        #download-btn:hover { background-color: #45a049; transform: scale(1.05); }

        /* --- REPRODUCTOR --- */
        #video-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: black;
            z-index: 20;
            display: none;
        }
        iframe { width: 100%; height: 100%; border: none; }

        /* --- BOTÓN RETROCEDER MINIMALISTA --- */
        #back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 30;
            cursor: pointer;
            background-color: rgba(0, 0, 0, 0.4); 
            color: rgba(255, 255, 255, 0.7);
            width: 45px;
            height: 45px;
            border-radius: 50%; 
            font-size: 22px;
            border: 1px solid rgba(255, 255, 255, 0.1); 
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        #back-btn:hover {
            background-color: rgba(0, 0, 0, 0.8);
            color: #fff;
            transform: scale(1.1);
        }

        /* --- MÓVIL RESPONSIVE --- */
        @media (max-width: 768px) {
            #lista-server {
                width: 100%;
                height: 100vh;
                justify-content: flex-start;
                padding-top: 30px;
                padding-left: 15px;
                padding-right: 15px;
            }
            h2 { font-size: 0.9rem; } 
            h3 { font-size: 0.7rem; margin-bottom: 15px; }
            #logo-list {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 10px;
            }
            #logo-list li { min-height: 80px; padding: 10px 5px; }
            #download-btn {
                padding: 8px 20px;
                font-size: 13px;
                margin-top: 25px;
                margin-bottom: 60px;
                width: auto;
            }
        }
    </style>
